<!DOCTYPE html>
<html>
<head>
    <title>ShopEasy - Login</title>
</head>

<body bgcolor="lightgray">

    <br><br><br>

    <center>

        <table border="1" cellpadding="20" cellspacing="0" bgcolor="white">

            <tr>
                <td>

                    <center>
                        <h1>🛍️ ShopEasy</h1>
                        <h2>Login</h2>
                        <p>Welcome back! Please login to your account.</p>
                    </center>

                    <form>

                        <table cellpadding="8">

                            <tr>
                                <td>
                                    <label for="email">
                                        <b>Email Address</b>
                                    </label>
                                </td>
                            </tr>

                            <tr>
                                <td>
                                    <input
                                        type="email"
                                        id="email"
                                        name="email"
                                        placeholder="Enter your email"
                                        size="35"
                                        required
                                    >
                                </td>
                            </tr>

                            <tr>
                                <td>
                                    <label for="password">
                                        <b>Password</b>
                                    </label>
                                </td>
                            </tr>

                            <tr>
                                <td>
                                    <input
                                        type="password"
                                        id="password"
                                        name="password"
                                        placeholder="Enter your password"
                                        size="35"
                                        required
                                    >
                                </td>
                            </tr>

                            <tr>
                                <td>
                                    <input
                                        type="checkbox"
                                        id="remember"
                                        name="remember"
                                    >
                                    <label for="remember">
                                        Remember Me
                                    </label>

                                    &nbsp;&nbsp;

                                    <a href="#">
                                        Forgot Password?
                                    </a>
                                </td>
                            </tr>

                            <tr>
                                <td align="center">
                                    <input
                                        type="submit"
                                        value="Login"
                                    >
                                    &nbsp;

                                    <input
                                        type="reset"
                                        value="Clear"
                                    >
                                </td>
                            </tr>

                        </table>

                    </form>

                    <hr>

                    <center>
                        <p>Don't have an account?</p>

                        <a href="#">
                            <b>Create New Account</b>
                        </a>
                    </center>

                </td>
            </tr>

        </table>

        <br>

        <p>
            © 2026 ShopEasy | All Rights Reserved
        </p>

    </center>

</body>
</html>
